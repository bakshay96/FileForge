services:
  - type: web
    name: fileforge-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip setuptools wheel && pip install -r requirements.txt"
    startCommand: "./.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: FileForge
      - key: DEBUG
        value: false
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: fileforge
      - key: TMP_DIR
        value: /tmp
      - key: MAX_FILE_SIZE_MB
        value: 20
      - key: FILE_EXPIRY_MINUTES
        value: 30
      - key: AUTH_EXPIRY_MINUTES
        value: 1440
      - key: CORS_ORIGINS
        value: "*"
